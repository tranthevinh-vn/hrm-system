version: '3.9'

# =============================================
# HRM System - Docker Compose
# Sinh vien: Tran The Vinh - DTC245240009
# Mon: Trien khai va Quan tri He thong PM
# =============================================

services:

  # ─────────────────────────────────────────
  # COMMIT 1: Web + Database + Reverse Proxy
  # ─────────────────────────────────────────

  hrm_mysql:
    image: mysql:8.0
    container_name: hrm_mysql
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      retries: 10
      start_period: 40s

  hrm_phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: hrm_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: hrm_mysql
      PMA_PORT: 3306
      PMA_ARBITRARY: 1
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    networks:
      - backend
    depends_on:
      hrm_mysql:
        condition: service_healthy

  hrm_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: hrm_web
    restart: unless-stopped
    environment:
      DB_HOST: hrm_mysql
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    networks:
      - frontend
      - backend
    depends_on:
      hrm_mysql:
        condition: service_healthy

  hrm_nginx:
    image: nginx:1.25-alpine
    container_name: hrm_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - frontend
    depends_on:
      - hrm_web

  # ─────────────────────────────────────────
  # COMMIT 2: Prometheus + Grafana
  # ─────────────────────────────────────────

  hrm_prometheus:
    image: prom/prometheus:latest
    container_name: hrm_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - monitoring

  hrm_node_exporter:
    image: prom/node-exporter:latest
    container_name: hrm_node_exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
    networks:
      - monitoring

  hrm_cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: hrm_cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks:
      - monitoring

  hrm_grafana:
    image: grafana/grafana:latest
    container_name: hrm_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  # ─────────────────────────────────────────
  # COMMIT 3: Loki + Promtail (Log)
  # ─────────────────────────────────────────

  hrm_loki:
    image: grafana/loki:2.9.0
    container_name: hrm_loki
    restart: unless-stopped
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    networks:
      - monitoring

  hrm_promtail:
    image: grafana/promtail:2.9.0
    container_name: hrm_promtail
    restart: unless-stopped
    volumes:
      - ./promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yaml
    dns:
      - 8.8.8.8
    networks:
      - monitoring
    depends_on:
      - hrm_loki

networks:
  frontend:
    driver: bridge
    name: hrm_frontend
  backend:
    driver: bridge
    name: hrm_backend
  monitoring:
    driver: bridge
    name: hrm_monitoring

volumes:
  db_data:
  grafana_data:
  loki_data:
