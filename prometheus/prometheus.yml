global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'node_exporter'
    static_configs:
      - targets: ['hrm_node_exporter:9100']
        labels:
          instance: 'ubuntu-server'

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['hrm_cadvisor:8080']
        labels:
          instance: 'docker-containers'
